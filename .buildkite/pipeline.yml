agents:
  image: "docker.elastic.co/ci-agent-images/ems/buildkite-agent-node26:1794481325@sha256:f50ff638abb6f307029fac99fd03f267e95904856714a3e85f67185a424602e4"
  cpu: "2"
  memory: "4G"

steps:
  - key: e2e-test
    label: ":playwright: E2E Test"
    command: "yarn install --frozen-lockfile --ignore-engines && yarn build-unsafe && yarn test -x"
    env:
      CI: "true"
    artifact_paths: 
      - "test-results/**/*.png"
      - "test-results/**/*.zip"
    agents:
      image: "docker.elastic.co/ci-agent-images/ems/playwright:21163@sha256:571e783a54fd2d2f01031964919210a0098c77dfa2cf0cf8e4be4d92987dc393"
      cpu: "2"
      memory: "4G"

  - key: build
    label: ":hammer_and_wrench: Build"
    command: ".buildkite/scripts/build.sh"
    artifact_paths: release.tar.gz
    agents:
      cpu: "2"
      memory: "4G"

  # Wait for e2e test to finish
  - wait: ~

  - key: deploy-staging
    label: ":rocket: Stage"
    if: build.tag == null && ( build.branch == "master"  || build.branch =~ /^v\d{1,2}\.\d{1,2}$$/ )
    depends_on:
      - build
      - e2e-test
    command: ".buildkite/scripts/upload.sh"
    env:
      EMS_ENVIRONMENT: "staging"

  - key: should-deploy
    block: ":one-does-not-simply: Deploy"
    if: build.tag =~ /(master|v\d{1,2}\.\d{1,2})-\d{4}-\d{2}-\d{2}/
    depends_on:
      - build
      - e2e-test

  - key: deploy-production
    label: ":shipit: Deploy"
    if: build.tag =~ /(master|v\d{1,2}\.\d{1,2})-\d{4}-\d{2}-\d{2}/
    depends_on: should-deploy
    commands:
      - ".buildkite/scripts/archive.sh"
      - ".buildkite/scripts/upload.sh"
    env:
      EMS_ENVIRONMENT: "production"
